# THOX compute — device-flagship registry block (Wave C)
#
# Four NEW entries for the per-device flagship fine-tune wave ordered by
# Tommy 2026-10-28. Written in the exact schema of tommytracx/thox-compute
# jobs.yaml (launcher.load_registry merges entry keys over defaults, and
# entry params over default params). INTEGRATION: append the four `jobs:`
# entries to the live jobs.yaml in the tommytracx/thox-compute Space repo.
# Every field that differs from the live defaults is set explicitly on each
# entry, so no defaults surgery is needed. The defaults block below exists
# only so this file also parses standalone for budget dry-runs.
#
# DATASET — read this before launching anything else from the old registry.
# The live registry's defaults still point at Thox-ai/thox-factory-sft-v4
# (215 rows), and its two v5 entries point at thox-factory-sft-v5
# train.jsonl (205 rows). NEITHER is the flagship corpus. The canonical
# corpus is the Wave B file in the same v5 dataset repo:
#   dataset:    Thox-ai/thox-factory-sft-v5
#   data_files: train_wave_b.jsonl
# Verified 2026-10-28 by direct download: exactly 982 rows, 494,495 bytes,
# every row a dict {"messages": [...], "meta": {...}}, every messages list
# exactly [system, user, assistant]. That matches train_lora.py's chat
# contract: prompt = chat template over messages[:-1], completion = last
# message + EOS, optional `system` column absent (system rides inside
# messages, which the renderer handles). The extra `meta` key is ignored
# by the renderer. Do not "fix" data_files back to train.jsonl: that is
# the 205-row predecessor corpus.
#
# RECIPE — the fleet-proven Wave B recipe (train_edge_sft.py,
# Thox-ai/thox-edge-sft, sha c250f9b), translated into plane param names:
#   LoRA r32 / alpha 64        -> lora_r: 32, lora_alpha: 64
#   LR 1e-4, cosine            -> learning_rate: 0.0001
#                                 (scheduler is hardcoded cosine in
#                                 train_lora.py; it is not a param)
#   3 epochs                   -> num_epochs: 3
#   max_length 1024            -> sequence_len: 1024
#                                 (the plane's name; a `max_length` key
#                                 would be silently ignored)
#   warmup fraction 0.05       -> warmup_steps: 10 (INTEGER — see below)
#   dropout 0.0                -> lora_dropout: 0.0
#
# warmup arithmetic: micro_batch_size 4 x grad_accum 4 = effective batch
# 16; ceil(982/16) = 62 steps/epoch; 3 epochs = 186 total steps; 5% of
# 186 = 9.3, rounded to 10. WARNING: train_lora.py casts warmup_steps with
# int(...). Copying the fleet's fractional 0.05 literally would silently
# become 0 (no warmup). Always express warmup as an integer here.
#
# DEPS — all four entries use deps: latest on the bare CUDA image (the
# same image override the gemma-4 entries carry). Evidence in PACK.md:
# edge-08b cannot run on pinned at all (model_type qwen3_5 postdates
# transformers 4.51.3), and pinned's trl 0.15.2 does not expose
# completion_only_loss, so on pinned the prompt is supervised — a
# deviation from the recipe that produced Wave B's 47/49.
#
# OUTPUT SHAPE — the plane publishes a LoRA ADAPTER (train_lora.py pushes
# adapter weights + tokenizer, private repo), not merged weights like the
# fleet fast-track did. Gating loads base + adapter (see GATE49.md). A
# merge step is required later before GGUF/Ollama conversion; it is not
# part of this wave.

defaults:
  image: nvidia/cuda:12.4.1-cudnn-devel-ubuntu22.04
  flavor: a100-large
  timeout: 8h
  dataset: Thox-ai/thox-factory-sft-v5
  data_files: train_wave_b.jsonl
  format: chat
  params:
    num_epochs: 3
    grad_accum: 4
    learning_rate: 0.0001
    warmup_steps: 10
    lora_r: 32
    lora_alpha: 64
    lora_dropout: 0.0

jobs:
  # ------------------------------------------------------- ThoxMini flagship
  # Tommy's settled flagship pick (the fleet Mac workstation eval + 2026-10-28 thinking-off
  # retest: completes, follows tools, ships with the grounded device-facts
  # system prompt). Also the ThoxKey / ThoxBeam HOST flagship payload:
  # ThoxKey runs no assistant model on-device (mesh-served), so this one
  # adapter covers two devices' flagship slots.
  - id: mini-phi4-flagship
    est_hours: 0.15
    status: ready
    desc: "ThoxMini flagship — Phi-4-mini-instruct LoRA on the Wave B corpus (also the ThoxKey/ThoxBeam host payload)"
    base_model: microsoft/Phi-4-mini-instruct
    dataset: Thox-ai/thox-factory-sft-v5
    data_files: train_wave_b.jsonl
    output_repo: Thox-ai/ThoxMini-Phi4Mini
    flavor: a10g-large
    deps: latest
    image: nvidia/cuda:12.4.1-cudnn-devel-ubuntu22.04
    params:
      num_epochs: 3
      grad_accum: 4
      micro_batch_size: 4
      learning_rate: 0.0001
      warmup_steps: 10
      lora_r: 32
      lora_alpha: 64
      lora_dropout: 0.0
      sequence_len: 1024

  # ---------------------------------------------------------- ThoxAir flagship
  # Fills the empty ThoxAir flagship slot (Air previously shipped only the
  # thoxair-16m-role model and rode the 350M tier + mesh). Same base and
  # recipe as ThoxEdge-0.5B, whose Wave B retrain gated 47/49 — the
  # strongest proven result in the edge line.
  - id: air-05b-flagship
    est_hours: 0.1
    status: ready
    desc: "ThoxAir flagship (NEW) — Qwen2.5-0.5B-Instruct LoRA on the Wave B corpus"
    base_model: Qwen/Qwen2.5-0.5B-Instruct
    dataset: Thox-ai/thox-factory-sft-v5
    data_files: train_wave_b.jsonl
    output_repo: Thox-ai/ThoxAir-0.5B
    flavor: a10g-small
    deps: latest
    image: nvidia/cuda:12.4.1-cudnn-devel-ubuntu22.04
    params:
      num_epochs: 3
      grad_accum: 4
      micro_batch_size: 4
      learning_rate: 0.0001
      warmup_steps: 10
      lora_r: 32
      lora_alpha: 64
      lora_dropout: 0.0
      sequence_len: 1024

  # ---------------------------------------------------------- ThoxEdge-0.8B
  # Wave C retrain of the held Edge-0.8B. Wave B training completed on
  # the fleet Windows workstation but its gate read 0/49 — a verified SERVING ARTIFACT (Ollama
  # 0.40.11 returns Qwen3.5 answers in the thinking channel with empty
  # content), not a measurement. The baseline to beat is Wave A's 19/49
  # (2.714/5). Output goes to a NEW repo: the published Thox-ai/ThoxEdge-0.8B
  # is never overwritten before the 49-question gate passes (GATE49.md).
  # deps: latest is MANDATORY here — model_type qwen3_5 /
  # Qwen3_5ForConditionalGeneration does not exist in pinned
  # transformers 4.51.3.
  - id: edge-08b-wavec
    est_hours: 0.1
    status: ready
    desc: "ThoxEdge-0.8B Wave C — Qwen3.5-0.8B LoRA on the Wave B corpus (Transformers gate replaces the Ollama artifact)"
    base_model: Qwen/Qwen3.5-0.8B
    dataset: Thox-ai/thox-factory-sft-v5
    data_files: train_wave_b.jsonl
    output_repo: Thox-ai/ThoxEdge-0.8B-WaveC
    flavor: a10g-small
    deps: latest
    image: nvidia/cuda:12.4.1-cudnn-devel-ubuntu22.04
    params:
      num_epochs: 3
      grad_accum: 4
      micro_batch_size: 4
      learning_rate: 0.0001
      warmup_steps: 10
      lora_r: 32
      lora_alpha: 64
      lora_dropout: 0.0
      sequence_len: 1024

  # ---------------------------------------------------------- ThoxClip 0.6B
  # The Clip swap fine-tune gated 22/49 (2.776/5) after training on the
  # 205-row diet. Wave C retrains the same base on the full 982-row Wave B
  # corpus. Output to a NEW repo for the same reason as Edge-0.8B: the
  # published Thox-ai/ThoxClip-Qwen3-0.6B stays untouched until the gate
  # shows improvement.
  - id: clip-06b-wavec
    est_hours: 0.1
    status: ready
    desc: "ThoxClip Wave C — Qwen3-0.6B LoRA on the full 982-row Wave B corpus (was 205-row, gated 22/49)"
    base_model: Qwen/Qwen3-0.6B
    dataset: Thox-ai/thox-factory-sft-v5
    data_files: train_wave_b.jsonl
    output_repo: Thox-ai/ThoxClip-Qwen3-0.6B-WaveC
    flavor: a10g-small
    deps: latest
    image: nvidia/cuda:12.4.1-cudnn-devel-ubuntu22.04
    params:
      num_epochs: 3
      grad_accum: 4
      micro_batch_size: 4
      learning_rate: 0.0001
      warmup_steps: 10
      lora_r: 32
      lora_alpha: 64
      lora_dropout: 0.0
      sequence_len: 1024
